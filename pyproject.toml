[project]
name = "skycalc-ipy"
version = "0.8.0.dev1"
description = "Get atmospheric spectral information from the ESO skycalc server."
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "Kieran Leschinski", email = "kieran.leschinski@unive.ac.at"},
]
maintainers = [
    { name = "Kieran Leschinski", email = "kieran.leschinski@unive.ac.at" },
    { name = "Hugo Buddelmeijer", email = "hugo@buddelmeijer.nl" },
    { name = "Fabian Haberhauer", email = "fabian.haberhauer@univie.ac.at" },
]
readme = "README.md"
keywords = [ "astronomy" ]
dynamic = [ "classifiers" ]
requires-python = ">=3.12,<3.15"
dependencies = [
    "numpy (>=2.2.6,<3.0.0)",
    "astropy (>=7.0.2,<9.0.0)",

    "httpx (>=0.28.1,<1.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "astar-utils (>=0.7.0,<1.0)",
]

[project.optional-dependencies]
syn = [
    "synphot>=1.7.0,<2.0.0",
]

[project.urls]
Repository = "https://github.com/AstarVienna/skycalc_ipy"
Documentation = "https://skycalc-ipy.readthedocs.io/en/latest/"
"Bug Tracker" = "https://github.com/AstarVienna/skycalc_ipy/issues"
Changelog = "https://github.com/AstarVienna/skycalc_ipy/releases"


[tool.poetry]
classifiers = [
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Astronomy",
]

[tool.poetry.group.test.dependencies]
pytest = "^9.1.1"
pytest-cov = "^7.1.0"
matplotlib = "^3.11.1"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
sphinx = "^9.1.0"
sphinx-book-theme = "^1.4.0"
sphinx-copybutton = ">=0.5.2,<1.0"
sphinxcontrib-apidoc = ">=0.6.0,<1.0"
sphinxcontrib-mermaid = "^2.1.0"
myst-nb = "^1.4.0"
sphinx-issues = "^6.0.0"
matplotlib = "^3.11.1"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
addopts = "--strict-markers"
markers = [
    "webtest: marks tests as requiring network (deselect with '-m \"not webtest\"')",
]
filterwarnings = [
    "error",
    # Should fix at some point, see #106
    "ignore::ResourceWarning",
]

[tool.coverage.report]
omit = ["skycalc_ipy/tests/*"]
